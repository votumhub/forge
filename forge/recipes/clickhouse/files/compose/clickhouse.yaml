# Receita clickhouse (serving) - gerada por `forge init --recipe clickhouse`.
# Como conecta: imagem clickhouse/clickhouse-server:26.3 (LTS); o código publica pelo módulo
#   serving/clickhouse_publish.py (pip install "clickhouse-connect>=0.8,<1") na porta HTTP 8123.
#   clickhouse/config.d/clickhouse-limits.xml limita memória e declara o disco de backup.
# Variáveis (env do alvo no forge.yaml): CLICKHOUSE_HTTP_PORT (8123 no host), CLICKHOUSE_USER,
#   CLICKHOUSE_PASSWORD (secret://CLICKHOUSE_PASSWORD) e CLICKHOUSE_DATABASE (criado no 1º boot).
# dev x prd: mesmo compose; porta, usuário e senha mudam só no env do alvo. Os volumes são por
#   projeto compose, então dev e prd nunca dividem dados.
# Backup: nunca copie o diretório de dados com o servidor ligado (parte MergeTree copiada no
#   meio de um merge não restaura); use `python -m <pacote>.serving.clickhouse_publish backup`,
#   que roda BACKUP para o disco `backups` (volume clickhouse-backups).
# Documentação: https://clickhouse.com/docs/install/docker (clickhouse-server 26.3)
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-backups:/backups
      - ${FORGE_ROOT}/clickhouse/config.d/clickhouse-limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    restart: unless-stopped

volumes:
  clickhouse-data: {}
  clickhouse-backups: {}
