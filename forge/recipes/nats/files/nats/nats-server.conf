# Receita nats (bus) - configuração do nats-server, montada por compose/nats.yaml.
# Como conecta: lido pelo nats-server 2.11 com `-c`; $NATS_AUTH_TOKEN é resolvido do ambiente
#   do container (que vem do env do alvo), então nenhum segredo mora neste arquivo.
# Variáveis (env do alvo no forge.yaml): NATS_AUTH_TOKEN (segredo: secret://NATS_AUTH_TOKEN).
# dev x prd: o mesmo arquivo; o valor do token é o de cada alvo.
# A porta de monitoramento 8222 com /healthz fica ligada: broker sem health é broker que
#   ninguém está olhando.
# Documentação: https://docs.nats.io/running-a-nats-service/configuration (nats-server 2.11)
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  token: $NATS_AUTH_TOKEN
}
