# Receita airflow (orchestrator) - serviço do forge para o Airflow 3 em compose.
# Como conecta: o forge sobe compose/airflow.yaml com -p <project> e --env-file do alvo, recria
#   a migração e os quatro processos a cada release (env e DAGs novos) e espera a API responder.
# Variáveis (env do alvo no forge.yaml): AIRFLOW_PORT (padrão 8080); o resto está no topo de
#   compose/airflow.yaml.
# dev x prd: igual nos dois; a diferença é o env do alvo.
# Documentação: https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html (apache-airflow 3.3)
compose:
  - compose/airflow.yaml
release_services:
  - airflow-init
  - airflow-api-server
  - airflow-scheduler
  - airflow-dag-processor
  - airflow-triggerer
health:
  url: http://localhost:${AIRFLOW_PORT:-8080}/api/v2/monitor/health
  timeout: 300
