# Receita debezium (ingestion) - gerada por `forge init --recipe debezium`.
# Como conecta: montado como /debezium/config/application.properties do Debezium Server 3.6
#   (compose/debezium.yaml). Aqui fica só o que é igual em todo alvo; o resto vem do env.
# Variáveis (env do alvo no forge.yaml): o Debezium Server lê variável de ambiente no lugar da
#   propriedade (nome em maiúsculas, ponto vira _): DEBEZIUM_SOURCE_CONNECTOR_CLASS,
#   DEBEZIUM_SOURCE_TOPIC_PREFIX, DEBEZIUM_SOURCE_DATABASE_HOSTNAME, DEBEZIUM_SOURCE_DATABASE_PORT,
#   DEBEZIUM_SOURCE_DATABASE_DBNAME, DEBEZIUM_SOURCE_DATABASE_USER,
#   DEBEZIUM_SOURCE_DATABASE_PASSWORD (secret://DEBEZIUM_SOURCE_DATABASE_PASSWORD),
#   DEBEZIUM_SOURCE_SNAPSHOT_MODE e DEBEZIUM_SINK_KAFKA_PRODUCER_BOOTSTRAP_SERVERS.
#   Qualquer outra propriedade do conector entra do mesmo jeito, ex.: para Postgres
#   DEBEZIUM_SOURCE_CONNECTOR_CLASS=io.debezium.connector.postgresql.PostgresConnector,
#   DEBEZIUM_SOURCE_PLUGIN_NAME=pgoutput e DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST=public.pedidos.
# dev x prd: em dev DEBEZIUM_SOURCE_SNAPSHOT_MODE=initial; em prd when_needed. Banco, prefixo
#   de tópico e brokers de cada alvo também vêm só do env do alvo.
# Regras que custaram caro:
# - connector.class e topic.prefix sempre declarados: sem prefixo que identifique a origem o
#   Debezium não sobe (e dois alvos com o mesmo prefixo misturam tópicos).
# - A senha do banco nunca é escrita neste arquivo: chega só pela variável de ambiente.
# - O sink é kafka, apontado para o bus do próprio projeto; nunca um cluster Kafka Connect à
#   parte, que é justamente o peso operacional que o Debezium Server evita.
# - A conta da origem é só de replicação (ex.: REPLICATION + SELECT no Postgres), nunca
#   superusuário.
# - Offsets e histórico de schema ficam em /debezium/data (volume): sem eles, cada restart
#   refaz o snapshot inteiro.
# Documentação: https://debezium.io/documentation/reference/stable/operations/debezium-server.html (debezium 3.6)
debezium.sink.type=kafka
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat
quarkus.http.port=8080
quarkus.log.console.json=true
