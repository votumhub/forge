[project]
name = "forge"
version = "3.0.3"
description = "Leva um repositório Python do zero ao deploy em dev e prd por docker compose, a partir de um forge.yaml."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VOTUM" }]
keywords = ["deploy", "docker-compose", "bundle", "ci", "prefect", "scaffold", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "jinja2~=3.1.6",
    "pydantic >=2.13.4,<3",
    "pyyaml ~=6.0.3",
    "tzdata ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/votumhub/forge"
Documentation = "https://github.com/votumhub/forge/blob/v3.0.2/docs/referencia.md"
Issues = "https://github.com/votumhub/forge/issues"
Changelog = "https://github.com/votumhub/forge/blob/v3.0.2/CHANGELOG.md"

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[dependency-groups]
dev = ["pytest ~=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
